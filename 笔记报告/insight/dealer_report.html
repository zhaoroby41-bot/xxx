<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>经销商 Insight</title>
  <style>
    :root{--ink:#1d1d1f;--muted:#6e6e73;--line:#dfe5ec;--blue:#007aff;--green:#34c759;--orange:#ff9500;--red:#ff3b30;--bg:#eef3f8;--surface:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}.report{padding:28px 30px 44px;max-width:1480px;margin:0 auto}.header{padding-bottom:18px;border-bottom:1px solid var(--line)}.eyebrow{color:var(--blue);font-size:13px;font-weight:750;letter-spacing:.04em}.header h1{font-size:30px;margin:7px 0}.header p{margin:0;color:var(--muted)}.controls{display:grid;grid-template-columns:minmax(280px,480px);gap:14px;margin:20px 0}.control label{display:block;color:var(--muted);font-size:13px;margin-bottom:6px}.control select{width:100%;height:42px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);font:inherit}.section{margin-top:28px}.section-title{font-size:21px;margin:0 0 6px}.section-note{margin:0 0 15px;color:var(--muted);font-size:14px}.grid{display:grid;gap:16px}.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}.two{grid-template-columns:1fr 1fr}.stack{display:grid;gap:16px}.card{padding:19px;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 1px 2px rgba(0,0,0,.025)}.metric{border-top:4px solid var(--blue);min-height:132px}.metric.green{border-top-color:var(--green)}.metric.orange{border-top-color:var(--orange)}.metric.red{border-top-color:var(--red)}.metric label{display:block;color:var(--muted);font-size:13px}.metric strong{display:block;font-size:29px;margin:8px 0}.metric small{color:var(--muted);font-size:12px}.status{display:inline-block;padding:4px 8px;border-radius:999px;font-size:12px;font-weight:700}.leading{color:#218838;background:#e8f8ed}.normal{color:#0066cc;background:#eaf3ff}.warning{color:#a86500;background:#fff5df}.critical{color:#c53b3b;background:#ffebeb}.bar-row{display:grid;grid-template-columns:108px 1fr 120px;gap:10px;align-items:center;margin:11px 0;font-size:13px}.bar-row span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bar-row i{height:9px;background:#eaf0f6;border-radius:99px;overflow:hidden}.bar-row b{display:block;height:100%;background:var(--blue);border-radius:99px}.bar-row.city b{background:#d89d21}.bar-row strong{text-align:right;font-size:12px;white-space:nowrap}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:11px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{color:var(--muted);font-weight:600}td small{display:block;color:var(--muted);margin-top:3px}.insight-list,.action-list{margin:2px 0 0;padding:0;list-style:none}.insight-item{padding:16px 0;border-bottom:1px solid var(--line)}.insight-item:first-child{padding-top:2px}.insight-item:last-child{padding-bottom:0;border-bottom:0}.insight-head{display:flex;gap:9px;align-items:center;margin-bottom:8px}.insight-index{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#eaf3ff;color:var(--blue);font-size:12px;font-weight:750;flex:0 0 auto}.insight-head strong{font-size:15px}.insight-summary,.insight-detail{margin:0;line-height:1.65;font-size:14px}.insight-summary{color:var(--ink)}.insight-detail{margin-top:6px;color:var(--muted)}.insight-label{font-weight:700;color:var(--ink);margin-right:5px}.insight-action{margin-top:10px;padding:9px 11px;border-left:3px solid var(--blue);background:#f3f8ff;color:#27476a;font-size:13px;line-height:1.55}.insight-action b{color:#0066cc;margin-right:5px}.action-item{padding:15px 0;border-bottom:1px solid var(--line)}.action-item:first-child{padding-top:2px}.action-item:last-child{padding-bottom:0;border-bottom:0}.action-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.action-head strong{font-size:15px}.action-meta{display:flex;gap:6px;flex:0 0 auto}.action-tag{display:inline-block;padding:3px 7px;border-radius:999px;font-size:11px;font-weight:750;white-space:nowrap}.priority-high{background:#ffebeb;color:#c53b3b}.priority-medium{background:#fff5df;color:#a86500}.priority-low{background:#eef1f5;color:#59636e}.confidence-supported{background:#e8f8ed;color:#218838}.confidence-validate{background:#eaf3ff;color:#0066cc}.confidence-signal{background:#f4efff;color:#6e45b8}.action-body{margin:8px 0 0;padding:9px 11px;background:#f7f9fc;border-left:3px solid #c8d6e8;color:#405166;font-size:13px;line-height:1.55}.action-body b{color:var(--ink);margin-right:6px}.loading,.error{padding:52px 20px;text-align:center;color:var(--muted)}.error{color:#c53b3b}@media(max-width:800px){.report{padding:20px 16px}.kpis,.two{grid-template-columns:1fr 1fr}}@media(max-width:540px){.kpis,.two{grid-template-columns:1fr}.bar-row{grid-template-columns:88px 1fr 110px}.insight-item,.action-item{padding:14px 0}.action-head{align-items:flex-start;flex-direction:column;gap:7px}}
  </style>
</head>
<body><main id="root" class="report"><div class="loading">正在加载经销商数据</div></main>
<script>
  const params = new URLSearchParams(location.search);
  const month = params.get('month') || '2026-07';
  const root = document.getElementById('root');
  const number = value => new Intl.NumberFormat('zh-CN').format(Math.round(Number(value || 0)));
  const compact = value => Math.abs(Number(value || 0)) >= 10000 ? `${(Number(value) / 10000).toFixed(1)}万` : number(value);
  const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
  const statusLabel = {leading:'领先',normal:'正常',warning:'预警',critical:'严重落后',unmatched:'未关联'};
  const postHeight = () => parent !== window && parent.postMessage({type:'dealer-report-height',height:Math.max(document.body.scrollHeight,document.documentElement.scrollHeight)}, '*');
  async function json(path){const response=await fetch(path);if(!response.ok)throw new Error('数据加载失败');return response.json()}
  function bars(rows,key,value,kind=''){const max=Math.max(...rows.map(row=>Number(row[value]||0)),1);return rows.map(row=>`<div class="bar-row ${kind}"><span title="${escapeHtml(row[key])}">${escapeHtml(row[key])}</span><i><b style="width:${Math.max(2,Number(row[value]||0)/max*100)}%"></b></i><strong>篇均阅读：${compact(row[value])}</strong></div>`).join('')}
  function render(dealer,index){
    const content=dealer.content||{};const accounts=dealer.accounts||[];const categories=(content.categories||[]).slice().sort((a,b)=>(b.reads_per_note||0)-(a.reads_per_note||0));const cityMap=new Map();(content.by_city_cohort||[]).forEach(row=>{const entry=cityMap.get(row.city)||{city:row.city,reads:0,notes:0};entry.reads+=Number(row.content?.reads||0);entry.notes+=Number(row.content?.notes||0);cityMap.set(row.city,entry)});const cities=[...cityMap.values()].map(row=>({...row,reads_per_note:row.notes?row.reads/row.notes:0})).sort((a,b)=>b.reads_per_note-a.reads_per_note);const kpi=dealer.kpi||{};const insights=dealer.ai_insights?.insights||[];const priorityMeta={high:{label:'高优先级',rank:3},medium:{label:'中优先级',rank:2},low:{label:'低优先级',rank:1}};const confidenceMeta={supported:'数据已验证',validate:'待验证',signal:'持续观察'};const recommendations=(dealer.recommendations||[]).slice().sort((a,b)=>(priorityMeta[b.priority]?.rank||0)-(priorityMeta[a.priority]?.rank||0)||String(a.title||'').localeCompare(String(b.title||''),'zh-CN'));
    root.innerHTML=`<header class="header"><div class="eyebrow">经销商 Insight · ${escapeHtml(month)}</div><h1>${escapeHtml(dealer.name)}</h1><p>展示该经销商及其下属门店账号的经营数据、内容分类、城市表现与行动建议。</p></header>
      <div class="controls"><div class="control"><label>选择经销商</label><select id="dealer-select">${index.dealers.map(item=>`<option value="${item.dealer_id}" ${item.dealer_id===dealer.dealer_id?'selected':''}>${escapeHtml(item.name)}</option>`).join('')}</select></div></div>
      <section class="section"><h2 class="section-title">整体数据表现（${escapeHtml(dealer.period?.fiscal_year||'FY26')} ${escapeHtml(dealer.period?.fiscal_quarter||'Q4')}）</h2><p class="section-note">当前月新发笔记采用本次快照指标；账号范围包含该经销商及下属门店。</p><div class="grid kpis"><article class="card metric"><label>当月总浏览</label><strong>${compact(content.reads)}</strong><small>${number(content.notes)} 条笔记</small></article><article class="card metric green"><label>当月互动量</label><strong>${compact(content.interactions)}</strong><small>互动率 ${(Number(content.interaction_rate||0)*100).toFixed(1)}%</small></article><article class="card metric orange"><label>当月新增粉丝</label><strong>${compact(content.new_fans)}</strong><small>每万浏览涨粉 ${(content.fans_per_10k_reads||0).toFixed(1)}</small></article><article class="card metric red"><label>KPI 状态</label><strong><span class="status ${kpi.overall_status||'normal'}">${statusLabel[kpi.overall_status]||'正常'}</span></strong><small>${number(accounts.length)} 个账号 / 门店</small></article></div></section>
      <section class="section grid two"><article class="card"><h2 class="section-title">KPI 进度</h2>${[['阅读量','reads'],['互动量','interactions'],['新增粉丝','fans']].map(([label,key])=>{const item=kpi[key]||{};return `<div class="bar-row"><span>${label}</span><i><b style="width:${Math.min(100,Number(item.completion_rate||0)*100)}%"></b></i><strong>${(Number(item.completion_rate||0)*100).toFixed(1)}%</strong></div>`}).join('')}</article><article class="card"><h2 class="section-title">分类与内容机会</h2><p class="section-note">数值为该分类的篇均阅读（阅读量 / 笔记数）。</p>${bars(categories,'category','reads_per_note')}</article></section>
      <section class="section"><h2 class="section-title">矩阵生态健康度</h2><p class="section-note">经销商下属账号与门店表现。</p><article class="card"><table><thead><tr><th>账号 / 门店</th><th>城市</th><th>阅读</th><th>新增粉丝</th><th>主页访客</th></tr></thead><tbody>${accounts.map(row=>`<tr><td><strong>${escapeHtml(row.account_name||row.author_id)}</strong><small>${escapeHtml(row.store||'经销商账号')}</small></td><td>${escapeHtml(row.city||'待补充')}</td><td>${compact(row.metrics?.reads)}</td><td>${compact(row.metrics?.new_fans)}</td><td>${compact(row.metrics?.visitors)}</td></tr>`).join('')}</tbody></table></article></section>
      <section class="section stack"><article class="card"><h2 class="section-title">区域与门店差异</h2><p class="section-note">数值为各城市下属账号/门店汇总后的篇均阅读（阅读量 / 笔记数）。</p>${cities.length?bars(cities,'city','reads_per_note','city'):'<p>暂无可用城市维度数据。</p>'}</article><article class="card"><h2 class="section-title">运营洞察与建议</h2><ul class="insight-list">${(insights.length?insights:['优先围绕 KPI 节奏、内容分类与城市门店差异制定行动。']).map((item,index)=>{if(typeof item==='string')return `<li class="insight-item"><p class="insight-summary">${escapeHtml(item)}</p></li>`;const action=(item.actions||[]).map(row=>row.action).filter(Boolean).join('；');const moduleLabels={growth_diagnosis:'经营增长诊断',matrix_health:'账号矩阵健康度',content_patterns:'内容结构与分类表现',user_signals:'用户互动与转化信号',regional_strategy:'城市与区域策略',action_plan:'下阶段行动计划',business_opportunities:'商业机会验证'};const title=moduleLabels[item.module]||item.title||'运营洞察';return `<li class="insight-item"><div class="insight-head"><span class="insight-index">${index+1}</span><strong>${escapeHtml(title)}</strong></div><p class="insight-summary"><span class="insight-label">关键结论</span>${escapeHtml(item.judgement||item.summary||'存在需要跟进的数据信号。')}</p>${item.why?`<p class="insight-detail"><span class="insight-label">判断依据</span>${escapeHtml(item.why)}</p>`:''}${item.impact?`<p class="insight-detail"><span class="insight-label">业务影响</span>${escapeHtml(item.impact)}</p>`:''}${action?`<div class="insight-action"><b>建议行动</b>${escapeHtml(action)}</div>`:''}</li>`}).join('')}</ul></article></section>
      <section class="section"><h2 class="section-title">下阶段行动指南</h2><p class="section-note">已按优先级排序，建议先处理高优先级和中优先级事项。</p><article class="card"><ul class="action-list">${recommendations.map(row=>{const priority=priorityMeta[row.priority]||{label:'待评估',rank:0};const confidence=confidenceMeta[row.confidence]||'持续观察';return `<li class="action-item"><div class="action-head"><strong>${escapeHtml(row.title||'待补充建议')}</strong><div class="action-meta"><span class="action-tag priority-${escapeHtml(row.priority||'low')}">${priority.label}</span><span class="action-tag confidence-${escapeHtml(row.confidence||'signal')}">${confidence}</span></div></div><p class="action-body"><b>执行动作</b>${escapeHtml(row.action||'暂无具体行动。')}</p></li>`}).join('')||'<li class="action-item">暂无行动建议。</li>'}</ul></article></section>`;
    document.getElementById('dealer-select').addEventListener('change',event=>load(event.target.value,index));setTimeout(postHeight,0);setTimeout(postHeight,300);
  }
  async function load(id,index){try{root.classList.remove('error');const payload=await json(`generated/months/${month}/dealers/${id}.json`);render(payload.dealer,index)}catch(error){root.className='report error';root.textContent=error.message}}
  (async()=>{try{const index=await json('generated/dealer_index.json');await load(index.dealers[0].dealer_id,index)}catch(error){root.className='report error';root.textContent=error.message}})();
</script></body></html>
