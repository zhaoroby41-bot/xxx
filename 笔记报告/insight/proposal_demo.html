<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>运营数据分析 Proposal Demo</title>
  <script>
    if ("scrollRestoration" in history) history.scrollRestoration = "manual";
    window.addEventListener("pageshow", event => {
      if (!event.persisted) window.scrollTo(0, 0);
    });
  </script>
  <style>
    :root {
      --bg: #eef3f8;
      --panel: #ffffff;
      --ink: #1d1d1f;
      --muted: #6e6e73;
      --line: #dfe5ec;
      --nav: #111113;
      --blue: #007aff;
      --green: #34c759;
      --orange: #ff9500;
      --red: #ff3b30;
      --teal: #30b0c7;
      --pink: #ff2d55;
      --shadow: 0 18px 44px rgba(28, 39, 54, .10);
      --radius: 8px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background: var(--bg);
    }

    * { box-sizing: border-box; }
    body { margin: 0; min-width: 1200px; background: var(--bg); }
    .shell { display: grid; grid-template-columns: 228px 1fr; min-height: 100vh; }
    .side {
      padding: 24px 16px;
      background: var(--nav);
      color: #f5f5f7;
    }
    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; }
    .mark { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 8px; background: #f5f5f7; color: #111; font-weight: 800; }
    .brand strong { display: block; font-size: 15px; }
    .brand span { display: block; margin-top: 2px; color: #9a9aa0; font-size: 12px; }
    .nav button {
      width: 100%;
      min-height: 42px;
      margin-bottom: 8px;
      border: 0;
      border-radius: 8px;
      padding: 0 12px;
      text-align: left;
      background: transparent;
      color: #b8b8bd;
      font: inherit;
      cursor: pointer;
    }
    .nav button.active { background: #b7ff2a; color: #111; font-weight: 700; }
    .side-note { margin-top: 28px; color: #8e8e93; font-size: 12px; line-height: 1.7; }

    .main { padding: 22px 28px 44px; }
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 54px;
      margin-bottom: 18px;
    }
    .toolbar h1 { margin: 0; font-size: 24px; letter-spacing: 0; }
    .toolbar-meta { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 12px; }
    .pill { border: 1px solid var(--line); border-radius: 999px; padding: 7px 10px; background: rgba(255,255,255,.72); }
    .pill.blue { border-color: rgba(0,122,255,.22); color: #0057c2; background: rgba(0,122,255,.09); }

    .hero {
      display: grid;
      grid-template-columns: 1.15fr .85fr;
      gap: 18px;
      margin-bottom: 18px;
    }
    .hero-main, .panel, .metric, .insight-card, .list-panel {
      border: 1px solid rgba(255,255,255,.72);
      border-radius: var(--radius);
      background: rgba(255,255,255,.88);
      box-shadow: var(--shadow);
    }
    .hero-main { padding: 24px; min-height: 238px; }
    .eyebrow { color: var(--blue); font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; }
    .hero-main h2 { margin: 10px 0 10px; font-size: 34px; line-height: 1.12; }
    .hero-main p { max-width: 760px; margin: 0; color: var(--muted); font-size: 15px; line-height: 1.7; }
    .hero-side { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .metric { padding: 16px; min-height: 112px; }
    .metric label { display: block; color: var(--muted); font-size: 12px; }
    .metric strong { display: block; margin-top: 8px; font-size: 26px; }
    .metric small { display: block; margin-top: 8px; color: var(--muted); }
    .metric.blue { border-top: 4px solid var(--blue); }
    .metric.green { border-top: 4px solid var(--green); }
    .metric.orange { border-top: 4px solid var(--orange); }
    .metric.pink { border-top: 4px solid var(--pink); }

    .grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 14px; }
    .span-4 { grid-column: span 4; }
    .span-5 { grid-column: span 5; }
    .span-6 { grid-column: span 6; }
    .span-7 { grid-column: span 7; }
    .span-8 { grid-column: span 8; }
    .span-12 { grid-column: span 12; }
    .panel, .list-panel { padding: 16px; }
    .panel h3, .list-panel h3 { margin: 0 0 12px; font-size: 16px; }
    .section-title { display: flex; justify-content: space-between; align-items: center; margin: 18px 0 10px; }
    .section-title h3 { margin: 0; font-size: 18px; }
    .section-title span { color: var(--muted); font-size: 12px; }

    .insight-card { padding: 16px; min-height: 210px; }
    .insight-card h4 { margin: 0 0 10px; font-size: 16px; }
    .insight-card p { margin: 0 0 10px; color: #3a3a3c; line-height: 1.65; }
    .insight-card .action { padding: 10px; border-radius: 8px; background: #f2f7ff; color: #0b4aa2; }
    .tag-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .tag { border-radius: 999px; padding: 4px 8px; background: #f2f2f7; color: var(--muted); font-size: 12px; }

    .bar-row { display: grid; grid-template-columns: 96px 1fr 64px; gap: 10px; align-items: center; margin: 10px 0; }
    .bar-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #3a3a3c; }
    .bar-track { height: 10px; border-radius: 999px; background: #e9edf3; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--blue), var(--teal)); }
    .bar-value { text-align: right; color: var(--muted); font-size: 12px; }

    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 10px 8px; border-bottom: 1px solid var(--line); text-align: left; font-size: 13px; }
    th { color: var(--muted); font-weight: 650; }
    td strong { font-weight: 700; }
    .status { border-radius: 999px; padding: 4px 8px; font-size: 12px; }
    .status.critical { background: rgba(255,59,48,.1); color: #bf1e15; }
    .status.warning { background: rgba(255,149,0,.13); color: #9a5a00; }
    .status.normal, .status.leading { background: rgba(52,199,89,.12); color: #167c33; }

    .controls { display: flex; align-items: end; gap: 12px; margin-bottom: 14px; }
    .control label { display: block; margin-bottom: 6px; color: var(--muted); font-size: 12px; }
    select {
      min-width: 280px;
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 10px;
      background: white;
      color: var(--ink);
    }
    .hidden { display: none !important; }
    .loading, .error { padding: 28px; border-radius: 8px; background: white; box-shadow: var(--shadow); }
    .error { color: var(--red); }
    .embedded-view { min-height: calc(100vh - 118px); }
    .embedded-intro { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin: 0 0 12px; }
    .embedded-intro h2 { margin: 0; font-size: 20px; }
    .embedded-intro p { margin: 0; color: var(--muted); font-size: 13px; }
    .embedded-frame {
      display: block;
      width: 100%;
      min-height: calc(100vh - 178px);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      box-shadow: var(--shadow);
      overflow-anchor: none;
    }
    .overview-frame { min-height: 700px; }
    .history-frame { min-height: 480px; }
    .apple-overview-wrap {
      width: 100%;
      max-width: none;
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="side">
      <div class="brand">
        <div class="mark">XI</div>
        <div><strong>运营数据分析</strong><span>Proposal Demo</span></div>
      </div>
      <nav class="nav">
        <button class="active" data-view="apple">Apple Insight</button>
        <button data-view="dealer">经销商 Insight</button>
      </nav>
      <p class="side-note">所有洞察均从月度爬虫数据、历史数据与 FY26 KPI 产物生成。未来可按登录账号自动切换视角。</p>
    </aside>

    <main class="main">
      <div class="toolbar">
        <h1>运营数据分析</h1>
        <div class="toolbar-meta">
          <span class="pill blue" id="period-pill">加载中</span>
          <span class="pill" id="freshness-pill">数据刷新中</span>
          <span class="pill" id="quality-pill">质量状态读取中</span>
        </div>
      </div>

      <div id="state" class="loading">正在读取本地生成数据...</div>
      <section id="apple-view" class="view hidden"></section>
      <section id="dealer-view" class="view hidden"></section>
    </main>
  </div>

  <script>
    const state = {
      month: "2026-07",
      apple: null,
      dealerIndex: null,
      dealerPayload: null,
      view: "apple"
    };

    const moduleNames = {
      growth_diagnosis: "增长诊断",
      matrix_health: "账号矩阵健康",
      content_patterns: "内容模式",
      user_signals: "用户信号",
      regional_strategy: "区域策略",
      action_plan: "行动计划",
      business_opportunities: "业务机会"
    };

    const fmt = new Intl.NumberFormat("zh-CN", { maximumFractionDigits: 0 });
    const pct = new Intl.NumberFormat("zh-CN", { style: "percent", maximumFractionDigits: 1 });

    function n(value) { return Number.isFinite(Number(value)) ? Number(value) : 0; }
    function num(value) { return fmt.format(n(value)); }
    function percent(value) { return Number.isFinite(Number(value)) ? pct.format(Number(value)) : "-"; }
    function statusText(status) {
      return { leading: "领先", normal: "正常", warning: "预警", critical: "严重滞后", unmatched: "未关联目标" }[status] || "待判断";
    }
    function statusClass(status) {
      if (status === "critical") return "critical";
      if (status === "warning") return "warning";
      if (status === "leading" || status === "normal") return "normal";
      return "warning";
    }
    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }
    async function getJson(path) {
      const response = await fetch(path);
      if (!response.ok) throw new Error(`${path} 读取失败`);
      return response.json();
    }
    function topBy(rows, key, limit = 5) {
      return [...(rows || [])].sort((a, b) => n(b[key]) - n(a[key])).slice(0, limit);
    }
    function evidenceMap(rows) {
      return Object.fromEntries((rows || []).map(row => [row.evidence_id, row]));
    }
    function evidenceText(ids, map) {
      return (ids || []).map(id => {
        const ev = map[id] || {};
        const scope = ev.scope || {};
        return `${moduleNames[ev.module] || ev.module}: ${ev.metric || "证据"} ${ev.value == null ? "" : num(ev.value)}${scope.category ? ` / ${scope.category}` : ""}${scope.city ? ` / ${scope.city}` : ""}`;
      }).filter(Boolean);
    }

    function insightCards(insights, evidence, role) {
      const map = evidenceMap(evidence);
      return (insights || []).map(item => {
        const tags = evidenceText(item.evidence_ids, map).slice(0, 2);
        const action = item.actions && item.actions[0] ? item.actions[0] : {};
        const roleLine = role === "apple"
          ? "Apple 方可用这条信号判断资源倾斜、区域打法和经销商分层管理。"
          : "经销商可用这条信号调整账号排期、内容分类和城市投放动作。";
        return `<article class="insight-card">
          <h4>${escapeHtml(moduleNames[item.module] || item.title)}</h4>
          <p>${escapeHtml(item.judgement)} ${escapeHtml(roleLine)}</p>
          <p>${escapeHtml(item.why)}</p>
          <div class="action">${escapeHtml(action.action || item.impact)}<br><small>${escapeHtml(action.success_metric || "")}</small></div>
          <div class="tag-row">${tags.map(tag => `<span class="tag">${escapeHtml(tag)}</span>`).join("")}</div>
        </article>`;
      }).join("");
    }

    function kpiMetrics(kpis) {
      return ["reads", "interactions", "fans"].map((key, index) => {
        const item = kpis[key] || {};
        const labels = { reads: "阅读 KPI", interactions: "互动 KPI", fans: "涨粉 KPI" };
        const colors = ["blue", "green", "orange"];
        return `<article class="metric ${colors[index]}">
          <label>${labels[key]}</label>
          <strong>${percent(item.completion_rate)}</strong>
          <small>完成 ${num(item.actual)} / 目标 ${num(item.target)}，${statusText(item.status)}</small>
        </article>`;
      }).join("");
    }

    function bars(rows, labelKey, valueKey, maxValue) {
      const max = maxValue || Math.max(...rows.map(row => n(row[valueKey])), 1);
      return rows.map(row => `<div class="bar-row">
        <div class="bar-name">${escapeHtml(row[labelKey])}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${Math.max(3, n(row[valueKey]) / max * 100)}%"></div></div>
        <div class="bar-value">${num(row[valueKey])}</div>
      </div>`).join("");
    }

    function renderApple() {
      const root = document.getElementById("apple-view");
      root.innerHTML = `
        <div class="apple-overview-wrap"><iframe class="embedded-frame overview-frame" title="Apple 数据总览" src="apple_insight.html?embed=overview&demo=1&v=20260813-2"></iframe></div>
        <iframe class="embedded-frame history-frame" title="小红书矩阵笔记商业分析报告" scrolling="no" src="../xhs_report.html?embed=apple&v=20260813-1"></iframe>`;
    }

    function dealerSummary(dealer) {
      const cats = topBy(dealer.content.categories, "reads_per_note", 5);
      const topCat = cats[0] || {};
      const weakKpi = ["reads", "interactions", "fans"]
        .map(key => ({ key, ...(dealer.kpi[key] || {}) }))
        .sort((a, b) => n(a.pacing_gap) - n(b.pacing_gap))[0] || {};
      const cityRows = dealer.content.by_city_cohort || [];
      const topCity = topBy(cityRows.map(row => ({
        city: row.city,
        reads: row.content && row.content.reads,
        notes: row.content && row.content.notes,
        reads_per_note: row.content && row.content.reads_per_note
      })), "reads_per_note", 1)[0] || {};
      return {
        topCat,
        weakKpi,
        topCity,
        cats
      };
    }

    function renderDealer() {
      const root = document.getElementById("dealer-view");
      root.innerHTML = `<iframe class="embedded-frame history-frame" title="经销商 Insight" scrolling="no" src="dealer_report.html?month=${state.month}&v=20260809-8"></iframe>`;
      return;
      const payload = state.dealerPayload;
      const dealer = payload.dealer;
      const summary = dealerSummary(dealer);
      const accounts = dealer.accounts || [];
      const recs = dealer.recommendations || [];
      const cityRows = topBy((dealer.content.by_city_cohort || []).map(row => ({
        city: row.city,
        cohort: row.cohort,
        notes: row.content && row.content.notes,
        reads_per_note: row.content && row.content.reads_per_note
      })), "reads_per_note", 6);

      root.innerHTML = `
        <div class="controls">
          <div class="control">
            <label>选择经销商</label>
            <select id="dealer-select">${state.dealerIndex.dealers.map(row => `<option value="${row.dealer_id}" ${row.dealer_id === dealer.dealer_id ? "selected" : ""}>${escapeHtml(row.name)}</option>`).join("")}</select>
          </div>
        </div>
        <div class="hero">
          <div class="hero-main">
            <div class="eyebrow">经销商 Insight</div>
            <h2>${escapeHtml(dealer.name)}</h2>
            <p>本页只展示该经销商自己的账号、城市、分类和 KPI 证据。老板演示时可以强调：未来登录账号不同，同一个 Insight 页面自动切换为不同数据权限和洞察语言。</p>
          </div>
          <div class="hero-side">
            <article class="metric blue"><label>账号数</label><strong>${num(accounts.length)}</strong><small>${dealer.cohort === "core_kpi" ? "含核心 KPI 账号" : "扩展门店观察"}</small></article>
            <article class="metric green"><label>本月笔记</label><strong>${num(dealer.content.notes)}</strong><small>来自当月爬虫笔记</small></article>
            <article class="metric orange"><label>优势分类</label><strong>${escapeHtml(summary.topCat.category || "-")}</strong><small>按单篇阅读效率</small></article>
            <article class="metric pink"><label>优势城市</label><strong>${escapeHtml(summary.topCity.city || "-")}</strong><small>城市差异化推广参考</small></article>
          </div>
        </div>

        <div class="section-title"><h3>AI 洞察主线</h3><span>经销商只看到自身证据和建议</span></div>
        <div class="grid">${insightCards(dealer.ai_insights.insights, dealer.evidence, "dealer").replaceAll('class="insight-card"', 'class="insight-card span-4"')}</div>

        <div class="section-title"><h3>经营建议</h3><span>围绕 KPI、分类发布、账号城市三件事</span></div>
        <div class="grid">
          <section class="panel span-6">
            <h3>FY26 Q4 KPI 节奏</h3>
            <div class="hero-side">${kpiMetrics(dealer.kpi)}</div>
            <p>当前最需要盯紧的是 ${escapeHtml({reads:"阅读", interactions:"互动", fans:"涨粉"}[summary.weakKpi.key] || "核心")} KPI，建议拆到账号和内容分类维度复盘。</p>
          </section>
          <section class="panel span-6">
            <h3>分类发布建议</h3>
            <p>${escapeHtml(summary.topCat.category || "高效分类")} 已显示更高内容效率，可加大选题复用；低样本或低效率分类应先做小批量验证，不宜直接铺量。</p>
            ${bars(summary.cats, "category", "reads_per_note")}
          </section>
          <section class="list-panel span-7">
            <h3>账号与城市差异</h3>
            <table><thead><tr><th>账号</th><th>城市</th><th>分层</th><th>阅读</th></tr></thead><tbody>
              ${accounts.slice(0, 8).map(row => `<tr><td><strong>${escapeHtml(row.account_name || row.author_id)}</strong></td><td>${escapeHtml(row.city || "待补齐")}</td><td>${escapeHtml(row.cohort)}</td><td>${num(row.reads)}</td></tr>`).join("")}
            </tbody></table>
          </section>
          <section class="panel span-5">
            <h3>城市推广策略</h3>
            <p>不同城市应按内容效率和账号分层拆策略：高效率城市沉淀素材模板，低样本城市先补供给和分类验证。</p>
            ${bars(cityRows, "city", "reads_per_note")}
          </section>
          <section class="list-panel span-12">
            <h3>系统生成行动建议</h3>
            <table><thead><tr><th>建议</th><th>动作</th><th>优先级</th><th>置信度</th></tr></thead><tbody>
              ${recs.slice(0, 8).map(row => `<tr><td><strong>${escapeHtml(row.title)}</strong></td><td>${escapeHtml(row.action)}</td><td>${escapeHtml(row.priority)}</td><td>${escapeHtml(row.confidence)}</td></tr>`).join("")}
            </tbody></table>
          </section>
        </div>`;

      document.getElementById("dealer-select").addEventListener("change", async event => {
        await loadDealer(event.target.value);
        renderDealer();
      });
    }

    function updateChrome() {
      const payload = state.apple;
      const p = payload.period || {};
      document.getElementById("period-pill").textContent = `${p.fiscal_year} ${p.fiscal_quarter} M${p.fiscal_month} / ${payload.source_month}`;
      document.getElementById("freshness-pill").textContent = `数据源：${payload.metadata?.data_freshness?.source_snapshot_at || "本地生成"}`;
      document.getElementById("quality-pill").textContent = payload.quality?.quality_status === "ready_with_warnings" ? "数据可用，有质量提示" : "数据可用";
    }

    async function loadDealer(dealerId) {
      state.dealerPayload = await getJson(`generated/months/${state.month}/dealers/${dealerId}.json`);
    }

    async function init() {
      try {
        state.apple = await getJson(`generated/months/${state.month}/apple.json`);
        state.dealerIndex = await getJson("generated/dealer_index.json");
        await loadDealer(state.dealerIndex.dealers[0].dealer_id);
        document.getElementById("state").classList.add("hidden");
        updateChrome();
        renderApple();
        renderDealer();
        showView("apple");
      } catch (error) {
        document.getElementById("state").className = "error";
        document.getElementById("state").textContent = error.message || "数据读取失败";
      }
    }

    function showView(view) {
      state.view = view;
      document.querySelectorAll(".nav button").forEach(button => button.classList.toggle("active", button.dataset.view === view));
      ["apple", "dealer"].forEach(name => {
        document.getElementById(`${name}-view`).classList.toggle("hidden", view !== name);
      });
    }
    window.addEventListener("message", event => {
      if (event.origin !== window.location.origin || !["apple-overview-height", "history-report-height", "dealer-report-height"].includes(event.data?.type)) return;
      const frame = event.data.type === "dealer-report-height"
        ? document.querySelector('iframe[title="经销商 Insight"]')
        : event.data.type === "apple-overview-height"
          ? document.querySelector('iframe[title="Apple 数据总览"]')
        : document.querySelector('iframe[title="小红书矩阵笔记商业分析报告"]');
      if (frame && Number.isFinite(event.data.height)) frame.style.height = `${Math.ceil(event.data.height)}px`;
    });
    document.querySelectorAll(".nav button").forEach(button => button.addEventListener("click", () => showView(button.dataset.view)));
    init();
  </script>
</body>
</html>
